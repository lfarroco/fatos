<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fatos Panel</title>
	<style>
		:root {
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			color: #0f172a;
			background: #f8fafc;
		}

		body {
			margin: 0;
			padding: 12px;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin-bottom: 12px;
		}

		button {
			border: 1px solid #334155;
			background: #0f172a;
			color: #f8fafc;
			padding: 6px 10px;
			border-radius: 6px;
			cursor: pointer;
		}

		#meta {
			font-size: 12px;
			line-height: 1.4;
			color: #334155;
			margin-bottom: 8px;
		}

		pre {
			margin: 0;
			padding: 10px;
			background: #e2e8f0;
			border-radius: 8px;
			max-height: calc(100vh - 120px);
			overflow: auto;
		}

		#tab-bar {
			display: flex;
			gap: 6px;
			margin-bottom: 12px;
			border-bottom: 1px solid #cbd5e1;
			padding-bottom: 8px;
		}

		#tab-bar .tab {
			border: 1px solid #cbd5e1;
			background: transparent;
			color: #334155;
			border-radius: 6px;
			font-family: inherit;
			font-size: 12px;
		}

		#tab-bar .tab.active {
			background: #0f172a;
			color: #f8fafc;
			border-color: #0f172a;
		}

		#panel-content {
			font-size: 12px;
		}

		textarea {
			width: 100%;
			box-sizing: border-box;
			font-family: inherit;
			font-size: 12px;
			padding: 8px;
			border: 1px solid #94a3b8;
			border-radius: 6px;
			background: #ffffff;
			resize: vertical;
		}

		input[type="number"] {
			font-family: inherit;
			font-size: 12px;
			padding: 4px 6px;
			border: 1px solid #94a3b8;
			border-radius: 6px;
			background: #ffffff;
		}
	</style>
</head>
<body>
	<header>
		<strong id="status">booting...</strong>
		<button id="inspect-btn" type="button">Request Snapshot</button>
	</header>
	<div id="meta">
		<div id="updated-at">last update: waiting for events</div>
		<div id="event-type">latest event: none</div>
	</div>
	<nav id="tab-bar">
		<button type="button" class="tab active" data-tab="facts">Facts</button>
		<button type="button" class="tab" data-tab="entities">Entities</button>
		<button type="button" class="tab" data-tab="timeline">Timeline</button>
		<button type="button" class="tab" data-tab="diff">Diff</button>
		<button type="button" class="tab" data-tab="query">Query</button>
	</nav>
	<div id="panel-content">waiting for snapshot</div>
	<script src="panel-ui.global.js"></script>
</body>
</html>
