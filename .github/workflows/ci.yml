name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        # dist/ is gitignored and cross-package imports resolve through each
        # package's built dist/, so a fresh checkout must build first.
        run: npm run build

      - name: Run tests (one-shot)
        # `npm test` starts vitest in watch mode and hangs in CI; `npx vitest
        # run` is the one-shot pass that exits.
        run: npx vitest run

      - name: Type-check
        run: npm run types
